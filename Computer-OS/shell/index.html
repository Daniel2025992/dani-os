<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DANI OS</title>
<style>
:root{--red:#e11d2e;--red2:#ff4d5e;--ink:#1d1d1f;--glass:rgba(255,255,255,.72);--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","Segoe UI",Rubik,Heebo,system-ui,sans-serif;color:var(--ink);user-select:none}
#wall{position:fixed;inset:0;background:
 radial-gradient(900px 600px at 15% 20%,#ff6b78 0,transparent 60%),
 radial-gradient(800px 700px at 85% 80%,#b3101f 0,transparent 55%),
 radial-gradient(700px 500px at 70% 15%,#ffd9dd 0,transparent 60%),
 linear-gradient(135deg,#fff5f6,#ffc7cd 45%,#e11d2e)}
#wm{position:fixed;right:48px;bottom:110px;width:min(340px,34vw);opacity:.92;pointer-events:none;filter:drop-shadow(0 12px 30px rgba(90,0,10,.35));z-index:1}
#desk{z-index:2}
body:not(.ready) #wm{display:none}
#menubar{position:fixed;top:0;left:0;right:0;height:28px;background:var(--glass);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;border-bottom:1px solid var(--line);z-index:9000}
#menubar b{color:var(--red)}
#desk{position:fixed;top:28px;bottom:0;left:0;right:0}
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.tb{height:38px;background:linear-gradient(#fafafa,#ececec);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;flex:none}
.tb .t{flex:1;text-align:center;font-size:13px;font-weight:600;color:#444}
.dots{display:flex;gap:8px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;display:block;cursor:pointer}
.dots .c{background:#ff5f57}.dots .m{background:#febc2e}.dots .x{background:#28c840}
.body{flex:1;overflow:auto;position:relative;background:#fff}
.rz{position:absolute;bottom:0;left:0;width:18px;height:18px;cursor:nesw-resize;touch-action:none}
#dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(24px);border-radius:22px;padding:8px 12px;display:flex;gap:10px;border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 40px rgba(0,0,0,.3);z-index:9000}
.di{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,#fff,#ffe1e4);display:grid;place-items:center;font-size:30px;cursor:pointer;position:relative;transition:transform .15s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.di.on::after{content:"";position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.di .tip{position:absolute;top:-30px;background:#222;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap}
.di:hover .tip{opacity:1}
.toast{position:fixed;top:40px;left:14px;background:var(--glass);backdrop-filter:blur(20px);padding:12px 16px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:9500;max-width:300px;font-size:14px;border-inline-start:4px solid var(--red)}
button.b{background:var(--red);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
button.b.s{background:#eee;color:#222}
button.b:disabled{opacity:.5}
input.i{border:1px solid #ddd;border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;width:100%}
.pad{padding:18px}
.card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.card .ic{font-size:34px}.card .meta{flex:1}.card small{color:#777}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:#f3f3f3;margin:0 0 6px 6px;font-size:12px;cursor:pointer}
.chip.on{background:var(--red);color:#fff}
.bar{display:flex;gap:6px;padding:6px;background:#f6f6f6;border-bottom:1px solid var(--line);align-items:center;direction:ltr}
.tabs{display:flex;gap:4px;padding:6px 6px 0;background:#e8e8e8;direction:ltr;overflow-x:auto}
.tab{padding:6px 12px;background:#d6d6d6;border-radius:8px 8px 0 0;font-size:12px;white-space:nowrap;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:#fff}
#menubar,.tb{direction:ltr}                 /* Mac layout: logo + traffic lights on the left even though the UI text is RTL */
.tb .t,#menubar #who,#menubar #appname{unicode-bidi:plaintext}
.dots i{position:relative}
.dots:hover i::after{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;color:rgba(0,0,0,.55);font-style:normal;font-weight:700}
.dots:hover .c::after{content:"✕"}.dots:hover .m::after{content:"−"}.dots:hover .x::after{content:"+"}
.win:not(.act) .dots i{background:#cfcfcf}
.win:not(.act) .tb .t{color:#999}
.win.act{box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.12)}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}65%{transform:translateY(-6px)}}
.di.bounce{animation:bounce .6s ease 1}
#menubar .l{display:flex;gap:18px;align-items:center}
#menubar .logo img{height:20px;display:block}
#menubar .logo{cursor:pointer;font-size:15px;color:var(--red);padding:2px 6px;border-radius:5px}
#menubar .logo:hover{background:rgba(0,0,0,.08)}
#menubar #appname{font-weight:700}
#menubar .r{display:flex;gap:14px;align-items:center}
.pop{position:fixed;top:30px;right:10px;background:var(--glass);backdrop-filter:blur(28px);border-radius:10px;padding:5px;min-width:200px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08);z-index:9800;font-size:13px}
.pop div{padding:6px 12px;border-radius:5px;cursor:pointer}
.pop div:hover{background:var(--red);color:#fff}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
#boot{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;background:
 radial-gradient(900px 600px at 15% 20%,#ff6b78 0,transparent 60%),radial-gradient(800px 700px at 85% 80%,#b3101f 0,transparent 55%),linear-gradient(135deg,#fff5f6,#ffc7cd 45%,#e11d2e)}
.boxm{width:min(420px,92vw);background:var(--glass);backdrop-filter:blur(30px);border-radius:26px;padding:34px;text-align:center;box-shadow:0 30px 90px rgba(90,0,10,.45)}
.boxm .big{font-size:64px;font-weight:700;background:linear-gradient(90deg,#e11d2e,#ff7a86);-webkit-background-clip:text;color:transparent;margin-bottom:6px}
.boxm .av{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:48px;margin:0 auto 12px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.boxm input.i{margin:6px 0;text-align:center}
.boxm .err{color:#c00;min-height:18px;font-size:13px}
body:not(.ready) #dock,body:not(.ready) #menubar{display:none}
#hello{font-size:78px;font-weight:700;height:104px;line-height:104px;white-space:nowrap;background:linear-gradient(90deg,#e11d2e,#ff7a86,#e11d2e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite;transition:opacity .5s,filter .5s,transform .5s}
#hello.out{opacity:0;filter:blur(10px);transform:translateY(12px)}
@keyframes flow{to{background-position:200% 0}}
.biglogo{display:block;width:min(360px,80%);margin:0 auto 4px;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
.hlogo{width:88px;height:88px;margin:0 auto 6px;filter:drop-shadow(0 10px 20px rgba(180,0,20,.45));animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.di svg{width:100%;height:100%;display:block;border-radius:14px}
.aic{width:48px;height:48px;flex:none}
.aic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.di{overflow:visible}
</style>
</head>
<body>
<div id="wall"></div>
<img id="wm" src="../../Shared/branding/logo.png" alt="">
<div id="menubar"><div class="l"><span class="logo" id="logo"><img src="../../Shared/branding/logo.png" alt="DANI OS"></span><span id="appname">Finder</span></div><div class="r"><span id="who"></span><span id="clock"></span></div></div>
<div id="desk"></div>
<div id="dock"></div>
<script src="system-apps.js"></script>
<script src="settings-app.js"></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('dani.'+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem('dani.'+k,JSON.stringify(v))};
const OS_VERSION="0.1.18";
const AGENT=store.get('agent','http://127.0.0.1:7788');      // Computer-OS/agent/agent.js
const PAIR=store.get('pairServer','http://127.0.0.1:7799');  // Shared/pairing-server.js
const isElectron=!!(window.process&&window.process.versions&&window.process.versions.electron)||navigator.userAgent.includes('Electron');

/* ---------- toast / clock ---------- */
function toast(msg,ms=4000){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('he-IL',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:!store.get('clk24',true)})},1000);

/* ---------- window manager (pointer events: mouse + touch) ---------- */
let z=10,wins={};
function openApp(id){
  const app=APPS[id]; if(!app) return;
  if(wins[id]){const w=wins[id];w.el.classList.remove('min');focus(w);refreshDock();return}
  const el=document.createElement('div');el.className='win';
  const W=Math.min(app.w||760,innerWidth-20),H=Math.min(app.h||520,innerHeight-120);
  Object.assign(el.style,{width:W+'px',height:H+'px',left:(40+Object.keys(wins).length*30)+'px',top:(20+Object.keys(wins).length*26)+'px'});
  el.innerHTML=`<div class="tb"><div class="dots"><i class="c"></i><i class="m"></i><i class="x"></i></div><div class="t">${app.title}</div><div style="width:50px"></div></div><div class="body"></div><div class="rz"></div>`;
  $('#desk').appendChild(el);
  const w={id,el,body:$('.body',el)};wins[id]=w;
  $('.c',el).onclick=()=>{el.remove();delete wins[id];app.onClose&&app.onClose();refreshDock()};
  $('.m',el).onclick=()=>{el.classList.add('min');refreshDock()};
  $('.x',el).onclick=()=>el.classList.toggle('max');
  const tb=$('.tb',el);
  tb.addEventListener('dblclick',()=>el.classList.toggle('max'));
  drag(tb,el,(dx,dy,s)=>{el.style.left=s.l+dx+'px';el.style.top=Math.max(0,s.t+dy)+'px'},()=>({l:el.offsetLeft,t:el.offsetTop}),()=>el.classList.contains('max'));
  drag($('.rz',el),el,(dx,dy,s)=>{el.style.width=Math.max(300,s.w-dx)+'px';el.style.height=Math.max(200,s.h+dy)+'px';el.style.left=(s.l+dx)+'px'},()=>({w:el.offsetWidth,h:el.offsetHeight,l:el.offsetLeft}),()=>el.classList.contains('max'));
  el.addEventListener('pointerdown',()=>focus(w));
  focus(w);app.render(w.body,w);refreshDock(id);
}
function focus(w){
  w.el.style.zIndex=++z;
  Object.values(wins).forEach(x=>x.el.classList.toggle('act',x===w));
  $('#appname').textContent=APPS[w.id].title;
}
function drag(handle,el,move,snap,blocked){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.dots')||blocked())return;
    const sx=e.clientX,sy=e.clientY,s=snap();handle.setPointerCapture(e.pointerId);
    const mv=ev=>move(ev.clientX-sx,ev.clientY-sy,s);
    const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up)};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);
  });
}

/* ---------- dock ---------- */
function refreshDock(bounceId){
  const d=$('#dock');d.innerHTML='';
  for(const [id,a] of Object.entries(APPS)){
    if(a.hidden&&!wins[id])continue;
    const i=document.createElement('div');i.className='di'+(wins[id]&&!wins[id].el.classList.contains('min')?' on':'')+(id===bounceId?' bounce':'');
    i.innerHTML=`${a.icon}<span class="tip">${a.title}</span>`;i.onclick=()=>openApp(id);d.appendChild(i);
  }
}

/* ---------- Browser (tabs, favorites, history) ---------- */
function normalizeUrl(v){v=v.trim();if(!v)return'about:blank';if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v))return'https://'+v;return'https://duckduckgo.com/?q='+encodeURIComponent(v)}
function browserApp(root,w,startUrl){
  let tabs=[],cur=-1;
  root.innerHTML=`<div class="tabs"></div><div class="bar"><button class="b s" data-a="back">◀</button><button class="b s" data-a="fwd">▶</button><button class="b s" data-a="reload">⟳</button><input class="i" placeholder="כתובת או חיפוש" style="direction:ltr"><button class="b s" data-a="fav">⭐</button><button class="b s" data-a="new">＋</button><button class="b s" data-a="menu">☰</button></div><div class="view" style="position:absolute;top:78px;bottom:0;left:0;right:0"></div>`;
  const tabsEl=$('.tabs',root),url=$('input',root),view=$('.view',root);
  function mk(u){
    const f=document.createElement(isElectron?'webview':'iframe');
    f.style.cssText='width:100%;height:100%;border:0;display:none;background:#fff';
    if(!isElectron)f.setAttribute('referrerpolicy','no-referrer');
    f.src=u;view.appendChild(f);
    const t={f,title:'לשונית חדשה',url:u};tabs.push(t);select(tabs.length-1);
    f.addEventListener&&f.addEventListener('did-navigate',e=>nav(t,e.url));
    f.addEventListener&&f.addEventListener('did-navigate-in-page',e=>{if(e.isMainFrame!==false){t.url=e.url;if(t===tabs[cur])url.value=e.url}});
    f.addEventListener&&f.addEventListener('did-fail-load',e=>{if(e.isMainFrame&&e.errorCode!==-3&&t===tabs[cur])page(`<h3>לא ניתן לפתוח את הדף</h3><p>${e.validatedURL||''}</p><p>בדוק שיש חיבור לאינטרנט ונסה שוב (${e.errorDescription||e.errorCode}).</p>`)});
    f.addEventListener&&f.addEventListener('page-title-updated',e=>{t.title=e.title;draw()});
    if(u!=='about:blank')nav(t,u);
  }
  function nav(t,u){t.url=u;if(t===tabs[cur])url.value=u;const h=store.get('history',[]);h.unshift({u,t:Date.now()});store.set('history',h.slice(0,300));draw()}
  function select(i){cur=i;tabs.forEach((t,k)=>t.f.style.display=k===i?'block':'none');url.value=tabs[i]?.url||'';draw()}
  function draw(){tabsEl.innerHTML='';tabs.forEach((t,i)=>{const e=document.createElement('div');e.className='tab'+(i===cur?' on':'');e.innerHTML=`${(t.title||t.url).slice(0,22)} <b data-x>×</b>`;e.onclick=ev=>{if(ev.target.dataset.x!==undefined){t.f.remove();tabs.splice(i,1);if(!tabs.length)mk('about:blank');else select(Math.min(cur,tabs.length-1))}else select(i)};tabsEl.appendChild(e)})}
  function page(html){const t=tabs[cur];t.f.style.display='none';let p=$('.pg',view);if(p)p.remove();p=document.createElement('div');p.className='pg pad';p.style.cssText='position:absolute;inset:0;overflow:auto;background:#fff';p.innerHTML=html;view.appendChild(p);return p}
  url.addEventListener('keydown',e=>{if(e.key==='Enter'){const u=normalizeUrl(url.value);const p=$('.pg',view);if(p)p.remove();tabs[cur].f.style.display='block';tabs[cur].f.src=u;nav(tabs[cur],u)}});
  root.addEventListener('click',e=>{
    const a=e.target.dataset?.a;if(!a)return;const f=tabs[cur].f;
    if(a==='new'){mk('about:blank');home()}
    if(a==='reload')f.reload?f.reload():(f.src=f.src);
    if(a==='back')isElectron&&f.goBack&&f.goBack();
    if(a==='fwd')isElectron&&f.goForward&&f.goForward();
    if(a==='fav'){const fv=store.get('favs',[]);if(!fv.find(x=>x.u===tabs[cur].url)){fv.push({u:tabs[cur].url,t:tabs[cur].title});store.set('favs',fv);toast('נוסף למועדפים')}}
    if(a==='menu'){const p=page(`<h3>מועדפים</h3>${store.get('favs',[]).map(x=>`<div><a href="#" data-go="${x.u}">${x.t||x.u}</a></div>`).join('')||'<small>אין עדיין</small>'}<h3>היסטוריה</h3>${store.get('history',[]).slice(0,40).map(x=>`<div style="direction:ltr;text-align:left"><a href="#" data-go="${x.u}">${x.u}</a></div>`).join('')||'<small>ריק</small>'}<p><button class="b s" data-clear>נקה היסטוריה</button></p>`);p.onclick=ev=>{const g=ev.target.dataset.go;if(g){ev.preventDefault();p.remove();tabs[cur].f.style.display='block';tabs[cur].f.src=g;nav(tabs[cur],g)}if(ev.target.dataset.clear!==undefined){store.set('history',[]);p.remove()}}}
  });
  function home(){
    url.value='';const fv=store.get('favs',[]);const tiles=[['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],['ויקיפדיה','https://he.wikipedia.org'],['Ynet','https://www.ynet.co.il'],['DuckDuckGo','https://duckduckgo.com'],['GitHub','https://github.com']];
    const p=page(`<div style="max-width:560px;margin:40px auto;text-align:center"><img src="../../Shared/branding/logo.png" style="width:200px"><h2>חיפוש באינטרנט</h2><input class="i" id="hq" placeholder="חפש או הקלד כתובת" style="width:100%;direction:ltr;font-size:16px"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px">${tiles.concat(fv.map(x=>[x.t||x.u,x.u])).map(x=>`<a href="#" data-go="${x[1]}" style="padding:12px 16px;border-radius:12px;background:#fff1f2;color:#e11d2e;text-decoration:none">${x[0]}</a>`).join('')}</div></div>`);
    const go=u=>{p.remove();tabs[cur].f.style.display='block';tabs[cur].f.src=u;nav(tabs[cur],u)};
    p.onclick=ev=>{const g=ev.target.dataset&&ev.target.dataset.go;if(g){ev.preventDefault();go(g)}};
    const hq=p.querySelector('#hq');hq.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&hq.value.trim())go(normalizeUrl(hq.value))});setTimeout(()=>hq.focus(),0);
  }
  w.openUrl=u=>{const p=$('.pg',view);if(p)p.remove();mk(u)};
  window.__openTab=u=>{w.openUrl&&w.openUrl(u)};
  mk(startUrl||'about:blank');
  if(!startUrl)setTimeout(home,0);
  if(false)setTimeout(()=>{const p=page('<h3>דפדפן DANI</h3><p>בתוך DANI OS המותקן הדפדפן רץ על <b>Chromium webview</b> וטוען כל אתר. בתצוגה בדפדפן רגיל, אתרים שחוסמים הטמעה (X-Frame-Options) לא יוצגו — זו מגבלת הדפדפן המארח, לא של המערכת.</p>')},0);
}

/* ---------- App Store ---------- */
async function storeApp(root){
  let cat=null,q='',catalog,mine=false;
  const chips=()=>`<div style="margin:10px 0"><span class="chip ${!cat&&!mine?'on':''}" data-c="">הכול</span><span class="chip ${mine?'on':''}" data-mine="1">מה יש לי</span>${catalog.categories.map(c=>`<span class="chip ${cat===c&&!mine?'on':''}" data-c="${c}">${c}</span>`).join('')}</div>`;
  const bindChips=()=>root.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{mine=c.hasAttribute('data-mine');cat=c.dataset.c||null;draw()});
  try{catalog=await (await fetch('../../Shared/catalog.json')).json()}catch{try{catalog=await (await fetch('catalog.json')).json()}catch{root.innerHTML='<div class="pad">לא ניתן לטעון את הקטלוג.</div>';return}}
  const inst=()=>store.get('installed',{});
  function draw(detail){
    const I=inst();
    if(mine&&!detail){ // "מה יש לי": built-in system apps + everything installed from the store
      const have=catalog.apps.filter(a=>I[a.id]);
      root.innerHTML=`<div class="pad">${chips()}
      <h3 style="margin:14px 0 8px">אפליקציות מערכת</h3>
      ${Object.entries(APPS).filter(([k])=>k!=='store').map(([k,a])=>`<div class="card" data-open="${k}"><div class="ic aic">${a.icon}</div><div class="meta"><b>${a.title}</b><br><small>מובנה במערכת</small></div><span>פתח</span></div>`).join('')}
      <h3 style="margin:14px 0 8px">הותקנו מהחנות (${have.length})</h3>
      ${have.map(a=>`<div class="card" data-id="${a.id}"><div class="ic aic">${appIcon(a)}</div><div class="meta"><b>${a.name}</b><br><small>${a.category} · גרסה ${I[a.id]}${I[a.id]!==a.version?' · יש עדכון':''}</small></div><span>${I[a.id]!==a.version?'⬆':'✓'}</span></div>`).join('')||'<small>עוד לא התקנת אפליקציות מהחנות. לחץ "הכול" כדי לבחור.</small>'}</div>`;
      bindChips();
      root.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>openApp(c.dataset.open));

async function agent(path,body){const r=await fetch(AGENT+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});return r.json()}

function updatesApp(root){

  const cmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)-(y[i]||0)}return 0};
  async function check(silent){
    try{const m=await (await fetch(store.get('updateUrl','../../Shared/update-manifest.json'),{cache:'no-store'})).json();
      if(cmp(m.latest,OS_VERSION)>0){if(root.isConnected){$('#st',root).innerHTML=`גרסה חדשה זמינה: <b>${m.latest}</b><br><small>${m.notes.join(' · ')}</small>`;$('#ins',root).style.display=''}toast('עדכון חדש ל-DANI OS: '+m.latest)}

    catch{if(!silent)$('#st',root).textContent='לא ניתן להגיע לשרת העדכונים.'}
  }
  $('#chk',root).onclick=()=>check(false);
  $('#ins',root).onclick=async()=>{$('#log',root).textContent='מתקין...';try{const r=await agent('/api/system/update');$('#log',root).textContent=r.msg||JSON.stringify(r)}catch{$('#log',root).textContent='סוכן המערכת לא זמין (מצב פיתוח בדפדפן). העדכון לא הותקן.'}};

function phoneApp(root){
  const J=(path,opt)=>fetch(PAIR+path,opt).then(r=>r.json());
  const link=store.get('phoneLink',null);
  if(link){
    root.innerHTML=`<div class="pad"><h2>📱 הטלפון מחובר</h2><p><b>${link.name.replace(/</g,'&lt;')}</b></p><button class="b" id="t">שלח הודעת בדיקה</button> <button class="b s" id="u">נתק</button></div>`;

    $('#u',root).onclick=async()=>{await J('/api/device/unlink',{method:'POST',headers:{authorization:'Bearer '+link.token}}).catch(()=>{});store.set('phoneLink',null);phoneApp(root)};
    return;
  }
  root.innerHTML=`<div class="pad"><h2>📱 חיבור טלפון</h2><p id="s">חיבור הטלפון הוא לא חובה. בלי הרשמה ובלי Wi-Fi משותף: רק קוד בן 6 ספרות, לשני המכשירים צריך אינטרנט.</p><div id="code" style="font-size:44px;letter-spacing:8px;font-weight:700;color:var(--red);direction:ltr;text-align:center;margin:18px 0"></div><button class="b" id="go">צור קוד חיבור</button><div id="ap" style="margin-top:14px"></div><p id="ip" style="color:#777;font-size:12px;direction:ltr;text-align:left"></p></div>`;
  fetch(AGENT+'/api/netinfo').then(r=>r.json()).then(n=>{if(n.ips&&n.ips.length)$('#ip',root).textContent='Manual address: '+n.ips.map(i=>i+':7799').join('  ')}).catch(()=>{});
  let timer;
  $('#go',root).onclick=async()=>{
    try{
      const r=await J('/api/pair/start',{method:'POST'});
      if(r.error){$('#s',root).textContent='שגיאה: '+r.error;return}
      const hdr={'x-pair-secret':r.secret};
      $('#code',root).textContent=r.code;$('#s',root).textContent='הזן את הקוד באפליקציית DANI OS Mobile. תקף ל-'+r.expiresIn+' שניות, לשימוש חד-פעמי.';
      clearInterval(timer);
      timer=setInterval(async()=>{
        const s=await J('/api/pair/status/'+r.pairId,{headers:hdr}).catch(()=>null);if(!s)return;
        if(s.state==='awaiting_approval'){
          $('#ap',root).innerHTML=`<b>הטלפון "${s.deviceName.replace(/</g,'&lt;')}" מבקש להתחבר.</b><br><button class="b" id="y">אשר</button> <button class="b s" id="n">דחה</button>`;
          $('#y',root).onclick=()=>J('/api/pair/approve/'+r.pairId,{method:'POST',headers:hdr});
          $('#n',root).onclick=()=>J('/api/pair/reject/'+r.pairId,{method:'POST',headers:hdr});
          $('#s',root).textContent=s.computerOk?'ממתין לאישור בטלפון…':'אשר כאן ובטלפון כדי להשלים.';
        }
        if(s.state==='paired'){clearInterval(timer);store.set('phoneLink',{name:s.deviceName,token:s.token});toast('הטלפון חובר');if(root.isConnected)phoneApp(root)}
        if(s.state==='expired'||s.state==='rejected'){clearInterval(timer);$('#s',root).textContent=s.state==='expired'?'הקוד פג תוקף.':'הבקשה נדחתה.';$('#code',root).textContent='';$('#ap',root).innerHTML=''}
      },1500);
    }catch{$('#s',root).textContent='שרת הצימוד אינו זמין. הפעל: node Shared/pairing-server.js'}
  };
}

const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function pwHash(pw,salt){ // PBKDF2-SHA256, 200k iterations; only the hash is stored, never the password
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,256));
}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function overlay(html){let o=$('#boot');if(!o){o=document.createElement('div');o.id='boot';document.body.appendChild(o)}o.innerHTML=html;return o}
function setupAssistant(done){
  let avatar='😀';
  let hello=null;
  const s1=()=>{
    const words=['שלום','Hello','مرحبا','Bonjour','Hola','こんにちは','你好','Привет','Ciao','Hallo','안녕하세요'];
    const o=overlay(`<div class="boxm" style="width:min(560px,94vw)"><img class="biglogo" src="../../Shared/branding/logo.png" alt="DANI OS"><div id="hello">${words[0]}</div><p>ברוכים הבאים ל-DANI OS</p><button class="b" id="go" style="padding:10px 26px;font-size:15px">המשך</button></div>`);
    const el=$('#hello',o);let i=0;
    hello=setInterval(()=>{el.classList.add('out');setTimeout(()=>{i=(i+1)%words.length;el.textContent=words[i];el.dir=/[֐-ۿ]/.test(words[i])?'rtl':'ltr';el.classList.remove('out')},500)},2200);
    $('#go',o).onclick=()=>{clearInterval(hello);s2()};
  };
  const s2=()=>{
    const o=overlay(`<div class="boxm"><h2>יצירת משתמש</h2><div class="av" id="av">${avatar}</div><div style="margin-bottom:10px">${['😀','🦊','🐼','🚀','🎮','🎨'].map(e=>`<span class="chip" data-e="${e}">${e}</span>`).join('')}</div><input class="i" id="nm" placeholder="שם" autofocus><input class="i" id="pw" type="password" placeholder="סיסמה (לא חובה)"><div class="err" id="er"></div><button class="b" id="ok">סיום</button></div>`);
    o.querySelectorAll('[data-e]').forEach(c=>c.onclick=()=>{avatar=c.dataset.e;$('#av',o).textContent=avatar});
    $('#ok',o).onclick=async()=>{
      const name=$('#nm',o).value.trim();if(!name){$('#er',o).textContent='נא להזין שם';return}
      const pw=$('#pw',o).value,u={name,avatar,salt:null,hash:null};
      if(pw){const salt=crypto.getRandomValues(new Uint8Array(16));u.salt=b64(salt);u.hash=await pwHash(pw,salt)}
      store.set('user',u);done();
    };
  };
  s1();
}

    else if(a==='settings')openSettings('wifi');
    else if(['wifi','bt','sound','wall'].includes(a))openSettings(a);
    else if(a==='lock'){const u=store.get('user');if(u.hash)await lockScreen(u);else toast('לא הוגדרה סיסמה – הגדר בהגדרות › משתמשים')}
    else if(a==='reboot'||a==='off'){if(!confirm(a==='off'?'לכבות את המחשב?':'להפעיל מחדש את המחשב?'))return;
      const r=await fetch(AGENT+'/api/sys/power',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:a==='off'?'poweroff':'reboot'})}).then(x=>x.json()).catch(()=>({ok:false}));toast(r.ok?'מבצע…':(r.msg||'לא זמין'))}};
  document.body.appendChild(p);
};
document.addEventListener('click',closePop);

/* dock magnification (mouse) */
$('#dock').addEventListener('mousemove',e=>{document.querySelectorAll('.di').forEach(i=>{const r=i.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2)),s=Math.max(1,1.7-d/90);i.style.transform=`translateY(${-(s-1)*14}px) scale(${s})`})});
$('#dock').addEventListener('mouseleave',()=>document.querySelectorAll('.di').forEach(i=>i.style.transform=''));

async function startSession(){
  let u=store.get('user',null);
  if(!u){ // profile written by the installer (name/avatar/optional password hash), if any
    try{const r=await fetch('/Shared/profile.json',{cache:'no-store'});if(r.ok){const p=await r.json();if(p&&p.name){u={name:p.name,avatar:p.avatar||'😀',salt:p.salt||null,hash:p.hash||null};store.set('user',u)}}}catch{}
  }
  if(!u){await new Promise(res=>setupAssistant(res));u=store.get('user')}
  if(u.hash&&u.salt)await lockScreen(u);
  const b=$('#boot');if(b)b.remove();
  document.body.classList.add('ready');
  $('#who').textContent=(u.avatar||'')+' '+u.name;
  refreshDock();openApp('store');
  setTimeout(()=>{updatesApp(document.createElement('div'));w_checkSoon&&w_checkSoon(true)},3000);
}
startSession();
</script>
