name: Inspect live-build bootloader files
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends live-build file imagemagick >/dev/null
          B=/usr/share/live/build/bootloaders
          echo "=== FILES ==="; (cd $B && find . -type f -printf '%p %s bytes\n' | sort)
          echo "=== PNG SIZES ==="; find $B -name '*.png' -exec identify -format '%d/%f %wx%h\n' {} \;
          echo "=== grub-pc/live-theme/theme.txt ==="; cat $B/grub-pc/live-theme/theme.txt 2>/dev/null || find $B -name 'theme*'
          echo "=== grub.cfg ==="; cat $B/grub-pc/grub.cfg 2>/dev/null | head -60
          echo "=== config.cfg ==="; cat $B/grub-pc/config.cfg 2>/dev/null | head -40
          echo "=== isolinux menu/stdmenu ==="; cat $B/isolinux/stdmenu.cfg 2>/dev/null | head -30
